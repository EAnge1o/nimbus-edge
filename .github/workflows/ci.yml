name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nimbus-edge
    steps:
      - uses: actions/checkout@v4
        with:
          path: nimbus-edge
      - name: Check out the inference core (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: EAnge1o/nimbus-infer-rs
          path: nimbus-infer-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nimbus-edge
      - name: Format (workspace packages only)
        run: cargo fmt -p nimbus-edge-core -p nimbus-edge-server -p nimbus-edge-cli -p nimbus-edge-tests -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --features nimbus-edge-core/test-support -- -D warnings
      - name: Unit + integration + black-box tests
        run: cargo test --workspace --features nimbus-edge-core/test-support
      - name: Release build (artifact binary)
        run: cargo build --release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write # publish the artifacts to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
          - os: windows-latest
            asset: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nimbus-edge
    steps:
      - uses: actions/checkout@v4
        with:
          path: nimbus-edge
      - name: Check out the inference core
        uses: actions/checkout@v4
        with:
          repository: EAnge1o/nimbus-infer-rs
          path: nimbus-infer-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nimbus-edge
      - name: Build release binary
        run: cargo build --release
      - name: Package (zip + SHA256)
        if: matrix.asset == 'windows-x64'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Package (tar.gz + SHA256)
        if: matrix.asset == 'linux-x64'
        shell: bash
        run: ./scripts/package.sh
      # Smoke the artifact exactly as a user runs it: extract, serve the
      # bundled model, complete a chat round-trip.
      - name: Smoke test the packaged artifact (windows)
        if: matrix.asset == 'windows-x64'
        shell: pwsh
        run: |
          Expand-Archive -Path (Resolve-Path dist/nimbus-edge-*.zip) -DestinationPath dist/extracted -Force
          $dir = (Get-Item dist/extracted/nimbus-edge-* | Select-Object -First 1).FullName
          ./scripts/smoke.ps1 -ArtifactDir $dir
      - name: Smoke test the packaged artifact (linux)
        if: matrix.asset == 'linux-x64'
        shell: bash
        run: |
          set -x
          ls -la dist/
          mkdir -p dist/extracted
          tar -xzf dist/nimbus-edge-*.tar.gz -C dist/extracted
          ls -la dist/extracted/
          bash scripts/smoke.sh dist/extracted/nimbus-edge-*/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-edge-${{ matrix.asset }}
          path: |
            nimbus-edge/dist/nimbus-edge-*.zip
            nimbus-edge/dist/nimbus-edge-*.zip.sha256
            nimbus-edge/dist/nimbus-edge-*.tar.gz
            nimbus-edge/dist/nimbus-edge-*.tar.gz.sha256
          if-no-files-found: error
      # Each platform job publishes only its own artifact patterns —
      # fail_on_unmatched_files would otherwise abort on the other OS's.
      - name: Publish to the GitHub Release (windows)
        if: matrix.asset == 'windows-x64'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            nimbus-edge/dist/nimbus-edge-*.zip
            nimbus-edge/dist/nimbus-edge-*.zip.sha256
      - name: Publish to the GitHub Release (linux)
        if: matrix.asset == 'linux-x64'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            nimbus-edge/dist/nimbus-edge-*.tar.gz
            nimbus-edge/dist/nimbus-edge-*.tar.gz.sha256
